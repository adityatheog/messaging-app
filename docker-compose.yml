version: '3.8'

services:
  messaging-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=argon-messaging-production-jwt-secret
      - CORS_ORIGIN=http://localhost:5173,https://localhost,http://localhost
    volumes:
      - app-data:/app/server/data
    restart: unless-stopped

volumes:
  app-data:
